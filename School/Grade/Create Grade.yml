info:
  name: Create Grade
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/api/grade
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "className" : "OP",
        "classSection" : "ID",
        "classTeacherId" : "DJ",
        "roomNumber" : "ND",
        "capacity" : "ND"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
